<script type="module">
import {MARKER} from './config.js';
window.postPrice = ()=>{
  const from=document.getElementById('from').value, to=document.getElementById('to').value, price=document.getElementById('price').value, time=document.getElementById('time').value;
  const slug = `${from}-${to}-${price}`.toLowerCase();
  const aviaLink = `https://www.aviasales.com/search/${from}${to}?marker=${MARKER}`;
  document.getElementById('priceFeed').innerHTML += `<div class="ugc-card"><b>${from}→${to} KES ${price}</b> <br/>Muda: ${time} <br/><a href="${aviaLink}" target="_blank" class="btn-primary">Angalia Ofa - Check Deal</a></div>`;
  // Auto creation logic - pushes to localStorage for SEO pages
  localStorage.setItem(slug, JSON.stringify({from,to,price,time}));
};
// Voice Search
document.getElementById('voiceBtn').onclick=()=>{
  const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang='sw-KE'; rec.onresult=(e)=>{alert('Umesema: '+e.results[0][0].transcript);}; rec.start();
};
// Lang Switch
let sw=true;
document.getElementById('langBtn').onclick=()=>{
  sw=!sw;
